<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GalaBoutique — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #FAF7F2;
      color: #3B1F0F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      opacity: 0.3;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 0.875rem; color: rgba(59,31,15,0.6); line-height: 1.6; }
    .brand { font-size: 1.125rem; font-weight: 700; color: #C9A84C; margin-bottom: 32px; }
  </style>
</head>
<body>
  <div class="brand">GalaBoutique</div>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3B1F0F" stroke-width="1.5">
    <line x1="2" y1="2" x2="22" y2="22"/>
    <path d="M8.5 8.5a4 4 0 015 5M5.5 5.5C3.4 7.1 2 9.4 2 12c0 5.52 4.48 10 10 10 2.6 0 4.9-1.4 6.5-3.5"/>
    <path d="M14.9 5.2A10 10 0 0122 12c0 1.1-.18 2.16-.5 3.14"/>
  </svg>
  <h1>No Connection</h1>
  <p>Your cart is saved and ready when you're back online.</p>
</body>
</html>
